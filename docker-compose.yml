services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-meeting-scheduler-db
    environment:
      POSTGRES_DB: minischeduler
      POSTGRES_USER: minischeduler
      POSTGRES_PASSWORD: minischeduler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U minischeduler -d minischeduler" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: mini-meeting-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/minischeduler
      SPRING_DATASOURCE_USERNAME: minischeduler
      SPRING_DATASOURCE_PASSWORD: minischeduler
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
